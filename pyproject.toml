[project]
name = "dmi"
version = "0.1.0"
description = "design-manufacture-interface: a product spec rendered into what a manufacturer reads"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmi"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/lead"]  # stdlib tooling ported from other departments, kept byte-identical in style

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
